[package]
name = "eldenring-mod-assist"
version = "1.2.0"
license = "GPL-3.0"
edition = "2021"
description = "Windows profile switcher and vanilla integrity checker for Elden Ring"

[lib]
name = "eldenring_mod_assist_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.6.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
prost = "0.13"
crc32fast = "1"
md-5 = "0.10"
winreg = "0.55"
rfd = { version = "0.15.4", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_Diagnostics_ToolHelp","Win32_UI_Shell","Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
